  msp-mcs:
    image: public.ecr.aws/pixelsofts/gomsp-edge:v1.0.2
    container_name: msp-mcs
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      PLC_PORT: ${MCS_PUB_PLC_PORT}
      PLC_HOST: ${MCS_PUB_PLC_HOST}
      MAIN_PLC_BRAND: ${MCS_PUB_MAIN_PLC_BRAND}
      MQTT_TOPIC: ${MCS_PUB_MQTT_TOPIC}
      DEVICES_2bit: ${MCS_PUB_DEVICES_2bit}
      DEVICES_16bit: ${MCS_PUB_DEVICES_16bit}
      DEVICES_ASCII: ${MCS_PUB_DEVICES_ASCII}
      PLC_MODEL: ${MCS_PUB_PLC_MODEL}
      PPROFT_PORT: ${MCS_PUB_PPROFT_PORT}
      MQTTS_ON: ${MCS_PUB_MQTTS_ON}
      # ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      # ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      # ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_HOST: ${MQTT_HOST}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  msp-mcs-job:
    image: public.ecr.aws/pixelsofts/gomsp-edge:v1.0.2
    container_name: msp-mcs-job
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      PLC_PORT: ${MCS_JOB_PUB_PLC_PORT}
      PLC_HOST: ${MCS_JOB_PUB_PLC_HOST}
      MAIN_PLC_BRAND: ${MCS_JOB_MAIN_PLC_BRAND}
      MQTT_TOPIC: ${MCS_JOB_PUB_MQTT_TOPIC}
      DEVICES_2bit: ${MCS_JOB_PUB_DEVICES_2bit}
      DEVICES_16bit: ${MCS_JOB_PUB_DEVICES_16bit}
      DEVICES_ASCII: ${MCS_JOB_PUB_DEVICES_ASCII}
      PLC_MODEL: ${MCS_JOB_PUB_PLC_MODEL}
      PPROFT_PORT: ${MCS_JOB_PUB_PPROFT_PORT}
      MQTTS_ON: ${MCS_JOB_PUB_MQTTS_ON}
      # ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      # ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      # ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_HOST: ${MQTT_HOST}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gopub-edge-mcs-job:
    image: public.ecr.aws/pixelsofts/gopub-edge:v1.1.1
    container_name: gopub-edge-mcs-job
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    env_file: .env
    environment:
      TENANT_ID: ${TENANT_ID}
      DEVICE_ID: ${MCS_DEVICE_ID}
      EMQX_CLIENT_ID_PREFIX: ${EMQX_CLIENT_ID_PREFIX}
      EMQX_INSERT_REQUEST_TOPIC: ${EMQX_INSERT_REQUEST_TOPIC}
      EMQX_HOST: ${EMQX_HOST}
      EMQX_PORT: ${EMQX_PORT}
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_TLS_ON: ${EMQX_TLS_ON}
      EMQX_CA_CERTIFICATE: ${EMQX_CA_CERTIFICATE}
      #ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      #ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      #ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_DEBUG: ${MQTT_DEBUG}
      MQTT_HOST: ${MQTT_HOST_CLEAR_DNS}
      MQTT_TOPIC: ${MCS_JOB_MQTT_TOPIC}
      MQTTS_ON: ${MCS_JOB_MQTTS_ON}
      MQTT_PORT: ${MCS_JOB_MQTT_PORT}
      # SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      TRIGGER_DEVICE: ${MCS_JOB_TRIGGER_DEVICE}
      INSERT_MODE: ${MCS_JOB_INSERT_MODE}
      FILTER: ${MCS_JOB_FILTER}
      LOOPING: ${MCS_JOB_LOOPING}
      CYCLE_MODE_ENABLED: ${MCS_JOB_CYCLE_MODE_ENABLED}
      CYCLE_ANCHOR_TOPIC: ${MCS_JOB_CYCLE_ANCHOR_TOPIC}
      CYCLE_TIMEOUT_SEC: ${MCS_JOB_CYCLE_TIMEOUT_SEC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gopub-edge-mcs:
    image: public.ecr.aws/pixelsofts/gopub-edge:v1.1.1
    container_name: gopub-edge-mcs
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    env_file: .env
    environment:
      TENANT_ID: ${TENANT_ID}
      DEVICE_ID: ${MCS_DEVICE_ID}
      EMQX_CLIENT_ID_PREFIX: ${EMQX_CLIENT_ID_PREFIX}
      EMQX_INSERT_REQUEST_TOPIC: ${EMQX_INSERT_REQUEST_TOPIC}
      EMQX_HOST: ${EMQX_HOST}
      EMQX_PORT: ${EMQX_PORT}
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_TLS_ON: ${EMQX_TLS_ON}
      EMQX_CA_CERTIFICATE: ${EMQX_CA_CERTIFICATE}
      #ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      #ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      #ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_DEBUG: ${MQTT_DEBUG}
      MQTT_HOST: ${MQTT_HOST_CLEAR_DNS}
      MQTT_TOPIC: ${MCS_MQTT_TOPIC}
      MQTTS_ON: ${MCS_MQTTS_ON}
      MQTT_PORT: ${MCS_MQTT_PORT}
      # SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      TRIGGER_DEVICE: ${MCS_TRIGGER_DEVICE}
      INSERT_MODE: ${MCS_INSERT_MODE}
      FILTER: ${MCS_FILTER}
      LOOPING: ${MCS_LOOPING}
      CYCLE_MODE_ENABLED: ${MCS_CYCLE_MODE_ENABLED}
      CYCLE_ANCHOR_TOPIC: ${MCS_CYCLE_ANCHOR_TOPIC}
      CYCLE_TIMEOUT_SEC: ${MCS_CYCLE_TIMEOUT_SEC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gopub-edge-healthcheck:
    image: public.ecr.aws/pixelsofts/gopub-edge:v1.0.2
    container_name: gopub-edge-healthcheck
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    env_file: .env
    environment:
      TENANT_ID: ${TENANT_ID}
      DEVICE_ID: ${HEALTHCHECK_DEVICE_ID}
      EMQX_CLIENT_ID_PREFIX: ${EMQX_CLIENT_ID_PREFIX}
      EMQX_INSERT_REQUEST_TOPIC: ${EMQX_INSERT_REQUEST_TOPIC}
      EMQX_HOST: ${EMQX_HOST}
      EMQX_PORT: ${EMQX_PORT}
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_TLS_ON: ${EMQX_TLS_ON}
      EMQX_CA_CERTIFICATE: ${EMQX_CA_CERTIFICATE}
      #ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      #ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      #ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_DEBUG: ${MQTT_DEBUG}
      MQTT_HOST: ${MQTT_HOST_CLEAR_DNS}
      MQTT_TOPIC: ${HEALTHCHECK_MQTT_TOPIC}
      MQTTS_ON: ${HEALTHCHECK_MQTTS_ON}
      MQTT_PORT: ${HEALTHCHECK_MQTT_PORT}
      MQTT_REPLY_TOPIC_PREFIX: ${HEALTHCHECK_MQTT_REPLY_TOPIC_PREFIX}
      MQTT_REPLY_TIMEOUT_SEC: ${HEALTHCHECK_MQTT_REPLY_TIMEOUT_SEC}
      LOCAL_VACUUM_REQUEST_TOPIC: ${HEALTHCHECK_LOCAL_VACUUM_REQUEST_TOPIC}
      # SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PLC_HOST: ${HEALTHCHECK_PLC_HOST}
      PLC_PORT: ${HEALTHCHECK_PLC_PORT}
      TRIGGER_DEVICE: ${HEALTHCHECK_TRIGGER_DEVICE}
      INSERT_MODE: ${HEALTHCHECK_INSERT_MODE}
      FILTER: ${HEALTHCHECK_FILTER}
      LOOPING: ${HEALTHCHECK_LOOPING}
      CYCLE_MODE_ENABLED: ${HEALTHCHECK_CYCLE_MODE_ENABLED}
      CYCLE_ANCHOR_TOPIC: ${HEALTHCHECK_CYCLE_ANCHOR_TOPIC}
      CYCLE_TIMEOUT_SEC: ${HEALTHCHECK_CYCLE_TIMEOUT_SEC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  govacuum-engine-gc:
    image: public.ecr.aws/pixelsofts/govacuum-engine-gc:v1.0.2
    container_name: govacuum-engine-healthcheck
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    env_file: .env
    environment:
      TENANT_ID: ${TENANT_ID}
      DEVICE_ID: ${DEVICE_ID}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SCHEMA:
      IQR_HISTORY_LIMIT:
      EMQX_CLIENT_ID_PREFIX: ${GO_VACUUM_ENGINE_EMQX_CLIENT_ID_PREFIX}
      EMQX_INSERT_REQUEST_TOPIC: ${EMQX_INSERT_REQUEST_TOPIC}
      EMQX_HOST: ${EMQX_HOST}
      EMQX_PORT: ${EMQX_PORT}
      EMQX_USERNAME: ${EMQX_USERNAME}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      EMQX_TLS_ON: ${EMQX_TLS_ON}
      EMQX_CA_CERTIFICATE: ${EMQX_CA_CERTIFICATE}
      MOSQUITTO_HOST: ${MQTT_HOST_CLEAR_DNS}
      MOSQUITTO_PORT: ${GO_VACUUM_ENGINE_MQTT_PORT}
      MOSQUITTO_TLS_ON: ${GO_VACUUM_ENGINE_MQTTS_ON}
      MOSQUITTO_CLIENT_ID_PREFIX: ${GO_VACUUM_ENGINE_MOSQUITTO_CLIENT_ID_PREFIX}
      LOCAL_VACUUM_REQUEST_TOPIC: ${GO_VACUUM_ENGINE_LOCAL_VACUUM_REQUEST_TOPIC}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    container_name: mosquitto_container
    image: eclipse-mosquitto:latest
    #ports:
    #  - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data:/mosquitto/data/
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 1883 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
