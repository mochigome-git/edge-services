services:
  msp-filling-machine:
    image: public.ecr.aws/pixelsofts/gomsp-edge:v1.0.2
    container_name: msp-filling-machine
    restart: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      PLC_PORT: ${PUB_PLC_PORT}
      PLC_HOST: ${PUB_PLC_HOST}
      MAIN_PLC_BRAND: ${PUB_MAIN_PLC_BRAND}
      MQTT_TOPIC: ${PUB_MQTT_TOPIC}
      DEVICES_2bit: ${PUB_DEVICES_2bit}
      DEVICES_16bit: ${PUB_DEVICES_16bit}
      PLC_MODEL: ${PUB_PLC_MODEL}
      PPROFT_PORT: ${PUB_PPROFT_PORT}
      MQTTS_ON: ${PUB_MQTTS_ON}
      # ECS_MQTT_CA_CERTIFICATE: ${ECS_MQTT_CA_CERTIFICATE}
      # ECS_MQTT_CLIENT_CERTIFICATE: ${ECS_MQTT_CLIENT_CERTIFICATE}
      # ECS_MQTT_PRIVATE_KEY: ${ECS_MQTT_PRIVATE_KEY}
      MQTT_HOST: ${MQTT_HOST}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

